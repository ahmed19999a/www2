name: Build Android WebView APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview-app/**'
      - '.github/workflows/build-android-webview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-webview-app
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-webview-app/app/build/outputs/apk/debug/app-debug.apk AlMonjezAlSaree.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlMonjezAlSaree-APK
          path: AlMonjezAlSaree.apk
          retention-days: 30
